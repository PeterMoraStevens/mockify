# Locally-managed tunnel config (if you're not using a dashboard TUNNEL_TOKEN).
# Same hostname for both: /peerjs goes to the signaling server, everything else
# to the app. Piston is intentionally NOT listed. It stays LAN-only.
tunnel: <your-tunnel-id>
credentials-file: /etc/cloudflared/<your-tunnel-id>.json

ingress:
  - hostname: mockify.example.com
    path: ^/peerjs
    service: http://peerjs:9000
  - hostname: mockify.example.com
    service: http://app:3000
  - service: http_status:404
